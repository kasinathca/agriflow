[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agriflow"
version = "1.4.1"
description = "Spatiotemporal analysis of Indian agricultural mandi price transmission, weather shocks and market integration"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Kasinath C A"},
  {name = "Kamal Nayan C S"}
]
dependencies = [
  "dash>=2.18,<4",
  "plotly>=5.24,<7",
  "pandas>=2.0,<3",
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "networkx>=3.0,<4",
  "statsmodels>=0.14,<1",
  "scikit-learn>=1.3,<2",
  "requests>=2.31,<3",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[project.scripts]
agriflow = "agriflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
